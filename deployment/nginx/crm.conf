# ── app.kreationhotels.com → CRM ──

server {
    listen 80;
    server_name app.kreationhotels.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.kreationhotels.com;

    # SSL (managed by certbot — these are placeholders until certs are generated)
    ssl_certificate     /etc/letsencrypt/live/app.kreationhotels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kreationhotels.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # API requests → CRM Backend
    location /api/ {
        proxy_pass http://crm-backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # Everything else → CRM Frontend (React static files)
    location / {
        proxy_pass http://crm-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
