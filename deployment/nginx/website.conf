# ── www.kreationhotels.com → Website ──

server {
    listen 80;
    server_name www.kreationhotels.com kreationhotels.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://www.kreationhotels.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.kreationhotels.com kreationhotels.com;

    # SSL (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/www.kreationhotels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kreationhotels.com/privkey.pem;

    # Redirect bare domain to www
    if ($host = kreationhotels.com) {
        return 301 https://www.kreationhotels.com$request_uri;
    }

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # API requests → Website Backend
    location /api/ {
        proxy_pass http://website-backend:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # Everything else → Website Frontend (React static files)
    location / {
        proxy_pass http://website-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
